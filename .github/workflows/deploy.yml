name: Deploy

# Deploys to the live cPanel site over SSH.
#
# It runs ONLY after CI has gone green on main, because a PHP file with a
# syntax error copied onto the live site takes the whole app down for every
# BDO in the field. Push -> CI -> (green) -> deploy. "Run workflow" on the
# Actions tab deploys by hand, and offers a dry run that changes nothing.
#
# NOTHING IS EVER DELETED on the server. rsync runs without --delete, so the
# two things that live only on the server survive every deploy:
#   lib/config.local.php  - the DB password. Losing it takes the site down.
#   uploads/proofs/*      - receipt photos. Business evidence; not recoverable.
# Both are excluded outright as well, so neither can be overwritten either.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run - list what WOULD change, touch nothing"
        type: boolean
        default: false

# One deploy at a time; never let two rsyncs interleave on the live site.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Copy public_html to the live site
    runs-on: ubuntu-latest
    # workflow_run fires on failure too - only a green CI may deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          # For workflow_run, check out the commit CI actually tested,
          # not whatever main happens to be by now.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Is deployment configured?
        id: pre
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          n=0
          [ -n "$SSH_KEY" ]  && n=$((n+1)) || true
          [ -n "$SSH_HOST" ] && n=$((n+1)) || true
          [ -n "$SSH_USER" ] && n=$((n+1)) || true
          if [ "$n" -eq 3 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$n" -eq 0 ]; then
            # Nothing set up yet. Skip quietly rather than paint every push red.
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment is not configured yet - skipping. Add the SSH_HOST, SSH_USER and SSH_KEY secrets to enable it."
          else
            echo "::error::Deployment is half-configured ($n of 3 secrets set). Set all of SSH_HOST, SSH_USER, SSH_KEY - or none."
            exit 1
          fi

      - name: Load the SSH key
        if: steps.pre.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"  || { echo "::error::secret SSH_KEY is not set";  exit 1; }
          test -n "$SSH_HOST" || { echo "::error::secret SSH_HOST is not set"; exit 1; }
          mkdir -p $HOME/.ssh && chmod 700 $HOME/.ssh
          printf '%s\n' "$SSH_KEY" > $HOME/.ssh/id_deploy
          chmod 600 $HOME/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> $HOME/.ssh/known_hosts 2>/dev/null
          chmod 600 $HOME/.ssh/known_hosts

      - name: Upload the app
        if: steps.pre.outputs.ready == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/public_html' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          DRY=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY="--dry-run"
            echo "DRY RUN - the server will not be modified."
          else
            # Same shape as .cpanel.yml: make sure the upload dirs exist first.
            ssh -i $HOME/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              "mkdir -p $DEPLOY_PATH/uploads/proofs"
          fi

          # -rlz            recurse, keep symlinks, compress
          # --chmod         sane modes; shared hosting rejects chown/chgrp
          # --itemize       print every file it decides to change
          # (no --delete)   nothing on the server is ever removed
          # A trailing slash on public_html/ copies the CONTENTS, dotfiles
          # included - so .htaccess needs no special case the way the
          # "cp public_html/*" glob in .cpanel.yml does.
          rsync -rlz --itemize-changes $DRY --chmod=D755,F644 \
            --exclude='lib/config.local.php' \
            --exclude='uploads/proofs/*' \
            -e "ssh -i $HOME/.ssh/id_deploy -p $SSH_PORT" \
            public_html/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

          if [ -z "$DRY" ]; then
            ssh -i $HOME/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              "chmod 755 $DEPLOY_PATH/uploads $DEPLOY_PATH/uploads/proofs"
          fi

      - name: Check the live site still answers
        if: steps.pre.outputs.ready == 'true' && inputs.dry_run != true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://hardwaresupermarkets.co.tz' }}
        run: |
          set -euo pipefail
          # health also proves PHP ran and the database is reachable - i.e. that
          # config.local.php survived the deploy.
          for i in 1 2 3 4 5; do
            if curl -sf --max-time 20 "$SITE_URL/api.php?action=health" | grep -q '"ok":true'; then
              echo "Live site healthy: $SITE_URL"; exit 0
            fi
            echo "attempt $i: not healthy yet, retrying..."; sleep 5
          done
          echo "::error::$SITE_URL did not report healthy after the deploy."
          exit 1

      - name: Always discard the key
        if: always()
        run: rm -f $HOME/.ssh/id_deploy
