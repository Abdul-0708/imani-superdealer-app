<body>
  <div id="app"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <!--
    THE APP MUST START WITHOUT THE INTERNET LIBRARIES.

    These two used to sit here as ordinary blocking scripts, ahead of app.js.
    A blocking script has to be fetched and run before the parser moves on, so
    on a network that could not reach cdnjs the browser sat waiting on a
    connection that never completed, app.js never ran, nothing rendered - and
    the officer watched the splash screen until he gave up. Field officers on
    one mobile network could not open the app at all while everyone else was
    fine, because their carrier could not reach cdnjs and the app made that
    cdnjs's decision to make.

    app.js now loads FIRST and alone, and the two libraries follow with async:
    fetched in the background, never blocking the parser, and never able to
    keep the login screen off a man's phone. Neither is touched at start-up -
    XLSX is for spreadsheets and QRCode for the 2FA square, both management
    jobs - so the app is completely usable before either arrives, and still
    usable if neither ever does.
  -->
  <script src="app.js?v=77"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" async></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" async></script>
</body>
</html>
